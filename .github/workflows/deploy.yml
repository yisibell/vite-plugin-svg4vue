name: Deploy

on:
  push:
    branches:
      - main
      - release/*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # pull code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install pnpm directly to avoid Corepack signature metadata failures.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      # Set a Node.js version
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      # build to static
      - name: Build Example
        run: pnpm install --frozen-lockfile && pnpm --filter example build-only

      # deploy to `docs` branch
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          folder: example/dist
          silent: true
          clean: true
          branch: gh-pages
          single-commit: true
