name: Deploy

on:
  push:
    branches:
      - main
      - release/*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Set a Node.js version
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.12.0

      # pull code
      - name: Checkout code
        uses: actions/checkout@v3

      # Enable the workspace package manager
      - name: Enable pnpm
        run: corepack enable

      # build to static
      - name: Build Example
        run: pnpm install --frozen-lockfile && pnpm --filter example build-only

      # deploy to `docs` branch
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          folder: example/dist
          silent: true
          clean: true
          branch: gh-pages
          single-commit: true
